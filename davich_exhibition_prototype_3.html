<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>다비치마켓 기획전 개선 프로토타입</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --ink:#111111; --sub:#767676; --line:#e5e5e5; --soft:#f5f5f5; --chip:#f2f2f2;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:#e9e9ee; font-family:Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    color:var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px 16px;
  }
  .caption{font-size:13px;color:#555;text-align:center;line-height:1.5}
  .caption b{color:#111}
  button{font-family:inherit;cursor:pointer;color:inherit}
  .phone{
    width:390px; height:844px; max-height:calc(100vh - 80px); background:#fff; border-radius:28px; overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.18); display:flex; flex-direction:column; position:relative;
  }
  @media (max-width:500px){
    body{padding:0;gap:0}
    .caption{display:none}
    .phone{width:100%;height:100vh;max-height:none;border-radius:0;box-shadow:none}
  }
  .scroller{flex:1;overflow-y:auto;position:relative;scrollbar-width:none}
  .scroller::-webkit-scrollbar{display:none}

  /* header */
  .hd{position:sticky;top:0;z-index:20;height:52px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 6px}
  .hd .l{display:flex;align-items:center;gap:2px}
  .hd h1{margin:0;font-size:17px;font-weight:700}
  .icon-btn{width:44px;height:44px;border:none;background:none;padding:0;display:flex;align-items:center;justify-content:center}

  .intro{padding:16px 16px 16px;display:flex;flex-direction:column;gap:6px}
  .intro h2{margin:0;font-size:24px;font-weight:800}
  .intro .date{font-size:13px;color:var(--sub)}
  .intro .desc{font-size:14px;color:#333;margin-top:4px}
  .banner{display:block;width:100%;height:auto}
  .gap8{height:8px;background:var(--soft)}

  /* tab bar */
  .tabs{position:sticky;top:52px;z-index:19;display:flex;background:#fff;border-bottom:1px solid var(--line);transition:box-shadow .2s}
  .tabs.stuck{box-shadow:0 4px 8px rgba(0,0,0,.07)}
  .tab{flex:1;height:50px;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;font-size:15px;font-weight:500;color:var(--sub);padding:0}
  .tab.on{border-bottom-color:var(--ink);font-weight:700;color:var(--ink)}

  /* section */
  .chips{margin:16px 16px 0;padding:4px;background:var(--chip);border-radius:12px;display:grid;gap:4px}
  .chip{height:40px;border-radius:9px;border:none;background:transparent;color:var(--sub);font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,color .15s,box-shadow .15s}
  .chip.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.12)}
  .chip .ico{width:12px;height:12px;border-radius:50%;flex:none}
  .chip .ico.color{background:conic-gradient(#c9864f,#6d4c9f,#4f7ec9,#7bb36a,#c9864f)}
  .chip .ico.clear{background:#fff;border:1.5px solid #7fb6d9}
  .chip:not(.on) .ico{opacity:.55}

  /* 각 카테고리 영역 상단 여백: 탭 이동 시에도 탭과 콘텐츠 사이 여유 확보 */
  section[data-cat]{padding-top:24px}
  section[data-cat] > :first-child{margin-top:0}
  .visual{margin:16px 16px 0;height:300px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;color:#555;line-height:1.5}
  .carousel{margin:16px 16px 0;height:240px;position:relative;overflow:hidden;border-radius:4px}
  .track{display:flex;height:100%;transition:transform .35s ease}
  .slide{flex:none;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500}
  .arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;padding:0}
  .arrow.prev{left:8px}.arrow.next{right:8px}
  .dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:5px 8px;border-radius:10px;background:rgba(0,0,0,.35)}
  .dot{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.6);transition:width .2s}
  .dot.on{width:16px;background:#fff}

  .brands{position:relative;display:flex;gap:10px;padding:18px 16px;overflow-x:auto;scrollbar-width:none}
  .brands::-webkit-scrollbar{display:none}
  .brands{-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;cursor:grab;user-select:none}
  .brands.dragging{cursor:grabbing}
  .brands.dragging .brand{pointer-events:none}
  .brand{flex:none;width:72px;border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px}
  .ring{width:68px;height:68px;border-radius:50%;border:2px solid transparent;padding:2px;transition:border-color .15s}
  .circle{width:60px;height:60px;border-radius:50%;border:1px solid #e3e3e3;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;color:#333;line-height:1.1;padding:4px;word-break:keep-all}
  .bname{font-size:12px;line-height:1.3;color:#555;font-weight:500;text-align:center;word-break:keep-all;width:72px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .brand.on .ring{border-color:var(--ink)}
  .brand.on .bname{color:var(--ink);font-weight:700}

  .hr{height:1px;background:#eee;margin:0 16px}
  .countrow{display:flex;justify-content:space-between;align-items:center;padding:4px 16px}
  .count{font-size:14px;font-weight:700}
  .count span{font-weight:500;color:var(--sub)}
  .sort{border:none;background:none;font-size:13px;color:#333;display:flex;align-items:center;gap:2px;height:44px;padding:0}

  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px;padding:0 16px}
  .card{display:flex;flex-direction:column;gap:5px}
  .card .img{aspect-ratio:1/1;border-radius:8px;background:#f3f3f3;display:flex;align-items:center;justify-content:center;font-size:12px;color:#999;margin-bottom:4px}
  .p-brand{font-size:12px;color:var(--sub)}
  .p-name{font-size:13px;color:#222;line-height:1.35}
  .p-price{font-size:14px;font-weight:700}
  .list{display:flex;flex-direction:column;gap:16px;padding:0 16px}
  .row{display:flex;gap:12px}
  .row .img{width:96px;height:96px;flex:none;border-radius:8px;background:#f3f3f3;display:flex;align-items:center;justify-content:center;font-size:11px;color:#999}
  .row .info{display:flex;flex-direction:column;gap:5px;padding-top:2px}
  .tag{align-self:flex-start;font-size:11px;background:var(--chip);color:#555;padding:3px 6px;border-radius:4px}

  .more-wrap{padding:20px 16px 28px}
  .more{width:100%;height:48px;border:1px solid #d5d5d5;border-radius:6px;background:#fff;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
  .more span{color:var(--sub);font-weight:500}
  .end-pad{height:28px}
  .footer-space{height:40px}

  /* floating */
  .top-btn{position:absolute;right:16px;bottom:76px;width:44px;height:44px;border-radius:50%;border:1px solid #ddd;background:#fff;display:flex;align-items:center;justify-content:center;padding:0;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
  .top-btn.show{opacity:1;pointer-events:auto}

  /* bottom nav */
  .nav{height:60px;border-top:1px solid #eee;display:flex;background:#fff;flex:none}
  .nav button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:#333;padding:0}
</style>
</head>

        { label:'투명렌즈', icon:'clear', visual:'투명렌즈 대표 이미지<br>(기존 동일)', vbg:'#e3f0f8',
          brands:[['인터로조',2],['뉴바이오',3]] }
      ] },
    { id:'lens', label:'안경렌즈', layout:'list', carousel:true,
      groups:[{ label:null, brands:[['한미',8]] }] }
  ];

  var state = {};
  DATA.forEach(function(c){ state[c.id] = { sub:0, brand:'ALL', shown:PAGE, slide:0 }; });

  var scroller = document.getElementById('scroller');
  var tabsEl = document.getElementById('tabs');
  var sectionsEl = document.getElementById('sections');
  var sentinel = document.getElementById('sentinel');
  var topBtn = document.getElementById('topBtn');
  var active = 'frame';
  var lockSpy = false, lockTimer = null;

  function esc(s){ return String(s).replace(/[&<>"]/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]; }); }

  function products(cat){
    var st = state[cat.id], g = cat.groups[st.sub], out = [];
    g.brands.forEach(function(b){
      if (st.brand !== 'ALL' && st.brand !== b[0]) return;
      for (var i = 1; i <= b[1]; i++) out.push({ brand:b[0], n:i });
    });
    if (st.brand === 'ALL') { // 브랜드 섞어서 노출 (인기순 가정)
      out.sort(function(a,b){ return (a.n - b.n) || 0; });
    }
    return out;
  }

  function renderTabs(){
    tabsEl.innerHTML = DATA.map(function(c){
      var on = c.id === active;
      return '<button class="tab' + (on ? ' on' : '') + '" role="tab" aria-selected="' + on + '" data-tab="' + c.id + '">' + c.label + '</button>';
    }).join('');
  }

  function renderSection(cat){
    var st = state[cat.id], g = cat.groups[st.sub], h = '';
    if (cat.groups.length > 1) {
      h += '<div class="chips" role="tablist" style="grid-template-columns:repeat(' + cat.groups.length + ',minmax(0,1fr))">' + cat.groups.map(function(gr, i){
        var on = i === st.sub;
        return '<button class="chip' + (on ? ' on' : '') + '" role="tab" aria-selected="' + on + '" data-act="sub" data-cat="' + cat.id + '" data-i="' + i + '">' +
          gr.label + '</button>';
      }).join('') + '</div>';
    }
    if (cat.carousel) {
      var slides = [['안경렌즈 배너 1 (기존 동일)','#dbeefc','#24496b'],['안경렌즈 배너 2 (기존 동일)','#fdf0d8','#6b4a12']];
      h += '<div class="carousel"><div class="track" style="transform:translateX(-' + (st.slide * 100) + '%)">' +
        slides.map(function(s){ return '<div class="slide" style="background:' + s[1] + ';color:' + s[2] + '">' + s[0] + '</div>'; }).join('') +
        '</div>' +
        '<button class="arrow prev" aria-label="이전 배너" data-act="slide" data-cat="' + cat.id + '" data-d="-1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>' +
        '<button class="arrow next" aria-label="다음 배너" data-act="slide" data-cat="' + cat.id + '" data-d="1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>' +
        '<div class="dots">' + slides.map(function(_, i){ return '<div class="dot' + (i === st.slide ? ' on' : '') + '"></div>'; }).join('') + '</div></div>';
    } else {
      h += '<div class="visual" style="background:' + g.vbg + '">' + g.visual + '</div>';
    }

    var list = [['ALL']].concat(g.brands);
    h += '<div class="brands">' + list.map(function(b, i){
      var name = b[0], isAll = name === 'ALL', on = st.brand === name;
      var size = isAll ? 15 : (name.length > 8 ? 9 : 11);
      return '<button class="brand' + (on ? ' on' : '') + '" aria-pressed="' + on + '" data-act="brand" data-cat="' + cat.id + '" data-b="' + esc(name) + '">' +
        '<div class="ring"><div class="circle" style="background:' + (isAll ? '#fff' : BGS[(i - 1) % BGS.length]) + ';font-size:' + size + 'px">' + esc(name) + '</div></div>' +
        '<span class="bname">' + (isAll ? '전체' : esc(name)) + '</span></button>';
    }).join('') + '</div>';

    var items = products(cat), total = items.length, show = items.slice(0, st.shown);
    var filterTxt = (g.label ? g.label + ' · ' : '') + (st.brand === 'ALL' ? '전체' : st.brand);
    h += '<div class="countrow"><div class="count">총 ' + total + '개 <span>· ' + esc(filterTxt) + '</span></div>' +
      '<button class="sort">인기순 <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div>';

    if (cat.layout === 'list') {
      h += '<div class="list">' + show.map(function(p){
        return '<div class="row"><div class="img">상품 이미지</div><div class="info"><div class="p-brand">' + esc(p.brand) + '</div><div class="p-name">' + esc(p.brand) + ' 안경렌즈 ' + p.n + '</div><div class="p-price">0,000원</div><div class="tag">단초점</div></div></div>';
      }).join('') + '</div>';
    } else {
      h += '<div class="grid">' + show.map(function(p){
        return '<div class="card"><div class="img">상품 이미지</div><div class="p-brand">' + esc(p.brand) + '</div><div class="p-name">' + esc(p.brand) + ' 상품 ' + p.n + '</div><div class="p-price">0,000원</div></div>';
      }).join('') + '</div>';
    }

    if (total > st.shown) {
      h += '<div class="more-wrap"><button class="more" data-act="more" data-cat="' + cat.id + '">' + cat.label + ' 더보기 <span>' + show.length + ' / ' + total + '</span>' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div>';
    } else {
      h += '<div class="end-pad"></div>';
    }
    document.getElementById('sec-' + cat.id).innerHTML = h;
  }

  function build(){
    sectionsEl.innerHTML = DATA.map(function(c, i){
      return (i > 0 ? '<div class="gap8"></div>' : '') + '<section id="sec-' + c.id + '" data-cat="' + c.id + '" aria-label="' + c.label + '"></section>';
    }).join('');
    DATA.forEach(renderSection);
    renderTabs();
  }

  function secTop(id){ return document.getElementById('sec-' + id).offsetTop; }

  function onScroll(){
    var y = scroller.scrollTop;
    tabsEl.classList.toggle('stuck', sentinel.offsetTop - y <= HEADER);
    topBtn.classList.toggle('show', y > 500);
    if (lockSpy) return;
    var cur = DATA[0].id;
    DATA.forEach(function(c){ if (secTop(c.id) - STICKY <= y + 2) cur = c.id; });
    if (cur !== active) { active = cur; renderTabs(); }
  }

  function goTo(id){
    active = id; renderTabs();
    lockSpy = true; clearTimeout(lockTimer);
    scroller.scrollTo({ top: secTop(id) - STICKY, behavior:'smooth' });
    lockTimer = setTimeout(function(){ lockSpy = false; onScroll(); }, 700);
  }

  // 선택한 브랜드가 좌/우 끝에 걸쳐 있으면, 옆 브랜드가 보이도록 부드럽게 이동
  function revealNeighbors(row, btn){
    if (!btn) return;
    var PEEK = 56;               // 다음(이전) 브랜드가 보여야 하는 최소 폭
    var GAP = 10, PAD = 16;
    var left = btn.offsetLeft, right = left + btn.offsetWidth;
    var viewL = row.scrollLeft, viewR = viewL + row.clientWidth;
    var max = row.scrollWidth - row.clientWidth;
    var target = null;
    if (right + GAP + PEEK > viewR - PAD) target = right + GAP + PEEK + PAD - row.clientWidth;
    else if (left - GAP - PEEK < viewL + PAD) target = left - GAP - PEEK - PAD;
    if (target === null) return;
    target = Math.max(0, Math.min(max, target));
    if (Math.abs(target - viewL) > 1) row.scrollTo({ left: target, behavior: 'smooth' });
  }

  function find(id){ for (var i = 0; i < DATA.length; i++) if (DATA[i].id === id) return DATA[i]; }

  tabsEl.addEventListener('click', function(e){
    var b = e.target.closest('[data-tab]'); if (b) goTo(b.getAttribute('data-tab'));
  });

  // 브랜드 영역 좌우 자유 스크롤: 모바일은 터치 스와이프(기본), PC는 마우스 드래그
  var drag = null, suppressClick = false;
  sectionsEl.addEventListener('mousedown', function(e){
    var row = e.target.closest('.brands'); if (!row || e.button !== 0) return;
    drag = { row: row, x: e.clientX, start: row.scrollLeft, moved: false };
    e.preventDefault();
  });
  window.addEventListener('mousemove', function(e){
    if (!drag) return;
    var dx = e.clientX - drag.x;
    if (!drag.moved && Math.abs(dx) > 5) { drag.moved = true; drag.row.classList.add('dragging'); }
    if (drag.moved) drag.row.scrollLeft = drag.start - dx;
  });
  window.addEventListener('mouseup', function(){
    if (!drag) return;
    if (drag.moved) { suppressClick = true; setTimeout(function(){ suppressClick = false; }, 0); }
    drag.row.classList.remove('dragging');
    drag = null;
  });

  sectionsEl.addEventListener('click', function(e){
    if (suppressClick) return;
    var b = e.target.closest('[data-act]'); if (!b) return;
    var cat = find(b.getAttribute('data-cat')), st = state[cat.id], act = b.getAttribute('data-act');
    var keepScroll = null;
    if (act === 'sub') { st.sub = +b.getAttribute('data-i'); st.brand = 'ALL'; st.shown = PAGE; }
    else if (act === 'brand') {
      var row = b.parentNode; keepScroll = row.scrollLeft;
      st.brand = b.getAttribute('data-b'); st.shown = PAGE;
    }
    else if (act === 'more') { st.shown += PAGE; }
    else if (act === 'slide') { st.slide = (st.slide + (+b.getAttribute('data-d')) + 2) % 2; }
    renderSection(cat);
    if (keepScroll !== null) {
      var nr = document.querySelector('#sec-' + cat.id + ' .brands');
      if (nr) {
        nr.scrollLeft = keepScroll;
        revealNeighbors(nr, nr.querySelector('.brand.on'));
      }
    }
    onScroll();
  });

  topBtn.addEventListener('click', function(){ scroller.scrollTo({ top:0, behavior:'smooth' }); });
  scroller.addEventListener('scroll', onScroll, { passive:true });

  build(); onScroll();
})();
</script>
</body>
</html>
